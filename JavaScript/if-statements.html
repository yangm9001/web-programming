<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>If Statements</title>
        <script>
            let input = prompt("Enter a number between 1 and 10")
            if(input < 4){
                console.log("TRUE");
            }

            if(input < 4){
                console.log("TRUE");
            }else{
                console.log("FALSE");
            }

            // ladder if statements (== is a comparison, = is the assignment operator, === is the strict equality operator)
            input = prompt("Enter a color");
            if(input == "red"){
                console.log("roses");
            }else if(input == "blue"){
                console.log("sky");
            }else if(input == "green"){
                console.log("grass");
            }else{
                console.log("unknown color");
            }

            input = prompt("Enter your age");
            if(input < 10){
                console.log("less than 10");
            }else if(input < 20){
                console.log("less than 20");
            }else{
                console.log("You are old as hell")
            }


        </script>
    </head>
    <body>
        
    </body>
</html>
